<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busywud Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              yellow: '#FFC800',
              yellowLight: '#FFFBEA',
              yellowHover: '#E5B400',
              black: '#111111',
              cardDark: '#1A1A1A',
              grayBg: '#F8F9FA'
            }
          },
          fontFamily: {
            display: ['Fredoka', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, .font-display { font-family: 'Fredoka', sans-serif; }
  </style>
</head>
<body class="bg-brand-grayBg dark:bg-brand-black text-brand-black dark:text-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-sm bg-white dark:bg-brand-cardDark rounded-3xl p-6 sm:p-8 shadow-2xl border-4 border-brand-yellow">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-extrabold">Admin Login</h1>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Busywud Store Management</p>
    </div>

    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-2">Email</label>
        <input type="email" id="adminEmail" required class="w-full border border-gray-300 dark:border-zinc-700 dark:bg-zinc-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-yellow" placeholder="admin@busywud.com">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-2">Password</label>
        <input type="password" id="adminPassword" required class="w-full border border-gray-300 dark:border-zinc-700 dark:bg-zinc-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-yellow" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-brand-yellow hover:bg-brand-yellowHover text-brand-black font-bold py-3 rounded-xl text-sm transition shadow">
        Sign In
      </button>
      <p id="adminLoginError" class="text-red-600 text-xs text-center hidden">Invalid credentials</p>
    </form>

    <div class="text-center mt-6">
      <a href="/" class="text-xs font-semibold text-gray-500 hover:text-brand-black dark:hover:text-brand-yellow transition">Back to Store</a>
    </div>
  </div>

  <script>
    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;
      const errorEl = document.getElementById('adminLoginError');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/admin';
        } else {
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
